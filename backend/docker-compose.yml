# 蜀道安全助手 docker-compose（本机部署编排）
# 用法：docker compose -f backend/docker-compose.yml up -d --build
# 说明（本机适配版）：
#   - MySQL / Redis 复用宿主机实例（本机 3306/6379 已有服务与数据），不再起容器，避免端口冲突；
#   - 后端容器经 host.docker.internal 连宿主 MySQL/Redis；LLM/视觉凭据从 backend/.env 自动注入
#     （compose 默认读取同目录 .env）；
#   - 模型目录（bge-*）与知识库（chroma_kb）、上传目录以卷挂载，镜像内不打包；
#   - 后端映射宿主 8002（避开本机 8000 的本地 uvicorn）；前端 nginx 映射 8080。
#   - 部署后访问 http://localhost:8080
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: shudao-backend
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-123456}@host.docker.internal:3306/shudao?charset=utf8mb4
      REDIS_URL: redis://host.docker.internal:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-random-64-char}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      # LLM / 视觉凭据：自动读取 backend/.env（compose 同目录 .env）
      BASE_URL: ${BASE_URL:-}
      API_KEY: ${API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL_NAME: ${VISION_MODEL_NAME:-}
      # 本地模型与知识库（卷挂载，镜像内不打包）
      DATA_DIR: /data
      EMBED_MODEL_DIR: /models/bge-large-zh
      RERANK_MODEL_DIR: /models/bge-reranker-base
      CHROMA_PERSIST_DIR: /data/chroma_kb
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./data:/data                     # 知识库/上传/敏感词/快捷提问/反例库（全量 data 挂载）
      - ${MODEL_DIR:-./models}:/models:ro   # 本地模型目录经 MODEL_DIR 环境变量指定（如 /path/to/models）
      - ../crawler_output:/crawler_output:ro   # E02 出题法规语料（law_json_dir）
    ports:
      - "8002:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: nginx:1.27-alpine
    container_name: shudao-frontend
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
